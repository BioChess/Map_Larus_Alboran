name: Actualizar datos Movebank

on:
  schedule:
    - cron: '0 0 * * *'  # Ejecutar cada 24 horas (a la medianoche UTC)
  workflow_dispatch:

jobs:
  update-movebank:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Necesario para el historial completo de Git

    - name: Set up R
      uses: r-lib/actions/setup-r@v2
      with:
        r-version: '4.3'  # Versión específica de R

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libcurl4-openssl-dev \
          libpng-dev \
          gdal-bin \
          libgdal-dev \
          pandoc \
          libudunits2-dev \
          libproj-dev \
          libssl-dev \
          libxml2-dev

    - name: Configurar repositorios R
      run: |
        echo 'options(repos = c(CRAN = "https://cloud.r-project.org"))' >> ~/.Rprofile
        echo 'options(HTTPUserAgent = sprintf("R/%s R (%s)", getRversion(), paste(getRversion(), R.version$platform, R.version$arch, R.version$os)))' >> ~/.Rprofile

    - name: Instalar paquetes R
      run: |
        # Instalar paquetes básicos primero
        Rscript -e 'install.packages(c("pacman", "remotes", "httr", "htmlwidgets"))'
        
        # Intentar instalar 'move' desde diferentes fuentes
        Rscript -e '
          if (!require("move")) {
            message("Intentando instalar move desde CRAN...")
            tryCatch({
              install.packages("move")
            }, error = function(e) {
              message("Falló CRAN estándar, intentando con repositorio alternativo...")
              remotes::install_version("move", version = "4.0.6", repos = "https://cloud.r-project.org")
            })
          }'
        
        # Verificar instalación de 'move'
        Rscript -e '
          if (!require("move")) {
            stop("No se pudo instalar el paquete move")
          } else {
            message("move instalado correctamente, versión: ", packageVersion("move"))
          }'
        
        # Instalar otros paquetes necesarios
        Rscript -e 'pacman::p_load(dplyr, lubridate, leaflet, htmlwidgets, sf, shiny)'
        
        # Verificar versiones
        Rscript -e 'writeLines(sprintf("Versiones instaladas:\n- move: %s\n- leaflet: %s\n- htmlwidgets: %s",
                          packageVersion("move"),
                          packageVersion("leaflet"),
                          packageVersion("htmlwidgets")))'

    - name: Preparar entorno
      run: |
        # Crear y asegurar permisos en docs
        mkdir -p docs
        chmod -R 755 docs
        rm -f docs/index.html || true
        rm -rf docs/index_files || true

    - name: Descargar datos de Movebank
      run: |
        Rscript 00_Download_data_Movebank.R
        if ! ls gps_data_*.csv 1> /dev/null 2>&1; then
          echo "::error::No se generó ningún archivo gps_data_*.csv"
          echo "Archivos en directorio:"
          ls -la
          exit 1
        fi
      env:
        MOVEBANK_USER: ${{ secrets.MOVEBANK_USER }}
        MOVEBANK_PASS: ${{ secrets.MOVEBANK_PASS }}

    - name: Generar mapa interactivo
      run: |
        echo "=== Versión de R y paquetes ==="
        Rscript -e 'sessionInfo()'
        
        echo "=== Generando mapa ==="
        Rscript --vanilla 01_Interactive_map.R
        
        echo "=== Verificando salida ==="
        echo "Estructura de docs/:"
        ls -l docs/
        
        if [ ! -f "docs/index.html" ]; then
          echo "::error::El archivo docs/index.html no se generó"
          exit 1
        fi
        
        if [ ! -d "docs/index_files" ] || [ -z "$(ls -A docs/index_files)" ]; then
          echo "::error::La carpeta docs/index_files no se generó correctamente o está vacía"
          exit 1
        fi
        
        echo "=== Contenido de docs/index_files ==="
        ls -l docs/index_files/

    - name: Subir cambios a GitHub
      run: |
        git config --global user.name "github-actions"
        git config --global user.email "actions@github.com"
        git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/BioChess/Map_Larus_Alboran.git
        
        # Obtener los últimos cambios
        git pull origin main
        
        # Limpiar archivos GPS antiguos (mantener los 2 más recientes)
        ls -tp gps_data_*.csv 2>/dev/null | grep -v '/$' | tail -n +3 | xargs -d '\n' -r rm -f --
        
        # Agregar cambios
        git add gps_data_*.csv
        git add docs/index.html docs/index_files/*
        
        # Verificar si hay cambios
        if [ -z "$(git status --porcelain)" ]; then
          echo "No hay cambios para hacer commit"
        else
          git commit -m "Actualización automática $(date +'%Y-%m-%d %H:%M')"
          git push origin main
        fi
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
